<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0057b8" />
    <title>Offline - Blog Platform</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        color: #222;
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.5;
      }
      main {
        max-width: 480px;
        margin: 64px auto;
        padding: 32px 16px;
        border: 1px solid #eee;
        border-radius: 4px;
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }
      button {
        min-height: 44px;
        padding: 8px 16px;
        border: 1px solid #0057b8;
        border-radius: 4px;
        background: #0057b8;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>
        This page could not be loaded because there is no internet connection. Pages and posts you
        have already opened are still available.
      </p>
      <button id="retry">Retry connection</button>
      <p id="result" role="status"></p>
    </main>
    <script>
      document.getElementById('retry').addEventListener('click', function () {
        var result = document.getElementById('result')
        result.textContent = 'Checking...'
        // "probe" makes the service worker skip its cache, so this is a real network request.
        fetch('./manifest.json?probe=' + Date.now(), { cache: 'no-store' }).then(
          function () {
            window.location.href = './'
          },
          function () {
            result.textContent = 'Still offline. Try again in a moment.'
          },
        )
      })
    </script>
  </body>
</html>
